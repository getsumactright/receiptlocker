<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReceiptLocker</title>
<meta name="description" content="ReceiptLocker scans and files business receipts for one-person US businesses. Your data stays on your iPhone or iPad.">
<link rel="icon" href="assets/logo/receiptlocker-mark.svg" type="image/svg+xml">
<link rel="icon" href="assets/logo/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
<style>
  :root { --bg: #ffffff; --text: #16181a; --muted: #5b6168; --accent: #3f6b00; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e0f10; --text: #eceee9; --muted: #9aa09a; --accent: #c8f04a; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 20px; }
  h1 { margin: 0 0 24px; line-height: 0; }
  h1 img { display: block; height: 56px; width: auto; max-width: 100%; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="assets/logo/receiptlocker-lockup-on-dark.svg">
      <img src="assets/logo/receiptlocker-lockup-on-light.svg" alt="ReceiptLocker" width="249" height="56">
    </picture>
  </h1>
  <p>Scan and file business receipts, ready for tax time. Made for one-person US businesses. No account, no server: your data stays on your iPhone or iPad.</p>
  <p><a href="privacy/">Privacy Policy</a> · <a href="mailto:privacy@wecanbuildthat.org">Contact</a></p>
</main>
</body>
</html>
